name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install analyzers
        shell: pwsh
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"
      # scripts/ci.ps1 is the source of truth for this job; see CONTRIBUTING.md.
      - name: Test stage
        run: pwsh -ExecutionPolicy Bypass -NoProfile -File ./scripts/ci.ps1

  race:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install race compiler
        run: choco install mingw -y --no-progress
      - name: Race stage
        run: pwsh -ExecutionPolicy Bypass -NoProfile -File ./scripts/ci.ps1 -Stage race
