name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go test
        run: go test ./...
      - name: Go test (UI build tags)
        run: go test -tags "seekfs_ui production" ./cmd/seekfs
      - name: Frontend unit test
        run: node --test scripts/
      - name: Go vet
        run: go vet ./...
      - name: gofmt
        shell: pwsh
        run: |
          $out = gofmt -l ./cmd/seekfs
          if ($out) {
            Write-Error "gofmt needed on:`n$out"
            exit 1
          }
      - name: Build
        run: go build -o seekfs.exe ./cmd/seekfs
      - name: CLI integration test
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\test_seekfs_cli.ps1
  race:
    runs-on: windows-latest
    env:
      SEEKFS_QUERY_MATRIX_SEED: "1"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install race compiler
        run: choco install mingw -y --no-progress
      - name: Go race test subset
        run: go test -race ./cmd/seekfs -run "TestSeededQueryOracleMatrix|TestSecondOracleSeededSubsample|TestEngineOverlayMutationStateMachineMatchesFreshOracle|TestEngineConcurrentChurnQueryStress|TestEngineOverlayMergeFillsLimitAndRanksCreates|TestEngineOverlayCountOnlySearchIncludesCreatesAndExcludesTombstones|TestEngineReadViewCachesUseSnapshotGeneration|TestEnginePersistVolumeCompactsOverlayToMappedBase|TestServiceVolumeIndexReplaysBinaryWAL|TestRewriteWALWithNoFramesResetsTheWAL|TestReplayLoopRetiresWhenGenChanges|TestReplayGenGuardDropsStaleBatch|TestPersistOverlayCarryKeepsPostSnapshotChanges|TestBackgroundNameTrigramBuildPublishesAtomicIndex|TestBackgroundNameOrderBuildPublishesResidentView|TestLockVolumeSearchCancelsWhileWaiting|TestPostingPrefetchHonorsBoundAndCancellation|TestServiceWatchDeltaCreatesModifiesDeletes|TestStandaloneServicePipeSearchEndToEnd|TestBroadPathScanCancellationPropagates"
